[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pessoal"
version = "0.1.0"
description = "Assistente pessoal modular, local-first e em portugues do Brasil."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jarvis Personal" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7", "keyring>=25,<27", "psutil>=5.9"]
voice = [
    "faster-whisper>=1.2,<2",
    "numpy>=1.26,<3",
    "pyttsx3>=2.99,<3",
    "sounddevice>=0.5,<1",
]
agent = ["dnspython>=2.6"]  # busca web = stdlib; dnspython = registros DNS no painel de seguranca
kokoro = ["kokoro-onnx>=0.4", "espeakng-loader>=0.2.4", "phonemizer>=3.4"]
tools = ["pymupdf>=1.24", "pillow>=10", "python-docx>=1.1", "pdf2docx>=0.5", "openpyxl>=3.1"]
vision = ["opencv-python>=4.8"]
full = [
    "PySide6>=6.8,<7",
    "keyring>=25,<27",
    "psutil>=5.9",
    "dnspython>=2.6",
    "faster-whisper>=1.2,<2",
    "numpy>=1.26,<3",
    "pyttsx3>=2.99,<3",
    "sounddevice>=0.5,<1",
    "kokoro-onnx>=0.4",
    "espeakng-loader>=0.2.4",
    "phonemizer>=3.4",
    "pymupdf>=1.24",
    "pillow>=10",
    "python-docx>=1.1",
    "pdf2docx>=0.5",
    "openpyxl>=3.1",
    "opencv-python>=4.8",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["ui/*.qml", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/avatar/jarvis-avatar-cortana-inspired-v3.png", "data/*.tsv.gz"]
